<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Introdução JavaScript</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-md bg-body-tertiary">
      <div class="container">
        <a class="navbar-brand" href="index.html"> BudgetFix </a>

        <div class="navbar-nav">
          <a class="nav-link" href="index.html">Tabela de despesas</a>
          <a class="nav-link" href="orcamento.html">Cálculo de orçamento</a>
        </div>
      </div>
    </nav>

    <main class="container mt-5">
      <h1 id="titulo">Tabela de orçamento</h1>

      <table class="table table-striped text-center">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Categorias</th>
            <th scope="col">Descrição</th>
            <th scope="col">Valor</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <br />

      <form class="card mt-4 text-center">
        <h1>Adicionar despesa</h1>
        <div class="mb-3">
          <label for="categoria" class="form-label">Categoria</label>
          <input
            type="text"
            class="form-control"
            id="categoria"
            placeholder="Digite a categoria"
          />
        </div>
        <div class="mb-3">
          <label for="descricao" class="form-label">Descrição</label>
          <input
            type="text"
            class="form-control"
            id="descricao"
            placeholder="Digite a descrição"
          />
        </div>
        <div class="mb-3">
          <label for="valor" class="form-label">Valor</label>
          <input
            type="number"
            class="form-control"
            id="valor"
            placeholder="Digite o valor"
          />
        </div>
        <button type="submit" id="botaoAdicionar" class="btn btn-primary">
          Adicionar
        </button>
      </form>
    </main>

    <script src="js/despesas.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
