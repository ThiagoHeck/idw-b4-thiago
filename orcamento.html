<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-md bg-body-tertiary">
      <div class="container">
        <a class="navbar-brand" href="index.html"> TechFix </a>

        <div class="navbar-nav">
          <a class="nav-link" href="index.html">Início</a>
          <a class="nav-link" href="orcamento.html">Orçamento</a>
        </div>
      </div>
    </nav>

    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <div class="card shadow-sm">
            <div class="card-body p-4">
              <h1 class="h3 mb-3">Simulador de Orçamento</h1>

              <form id="formulario" novalidate>
                <div class="mb-3">
                  <label for="nome" class="form-label"> Nome do cliente </label>
                  <input type="text" id="nome" class="form-control" />
                </div>

                <div class="mb-3">
                  <label for="servico" class="form-label">
                    Serviço Desejado
                  </label>
                  <select id="servico" class="form-select"></select>
                </div>

                <div class="mb-3">
                  <label for="quantidade" class="form-label">
                    Quantidade
                  </label>
                  <input
                    type="number"
                    id="quantidade"
                    class="form-control"
                    min="1"
                    step="1"
                  />
                </div>

                <button type="submit" class="btn btn-primary w-100">
                  Calcular orçamento
                </button>
              </form>

              <section class="card mt-4">
                <div class="card-body">
                  <h2 class="h5">Cadastrar novo serviço</h2>

                  <form id="formCadastro" novalidate>
                    <div class="mb-3">
                      <label for="novoNome" class="form-label">
                        Nome do serviço
                      </label>
                      <input id="novoNome" class="form-control" type="text" />
                    </div>

                    <div class="mb-3">
                      <label for="novoPreco" class="form-label"> Preço </label>
                      <input
                        id="novoPreco"
                        class="form-control"
                        type="number"
                        min="0.01"
                        step="0.01"
                      />
                    </div>

                    <button class="btn btn-success" type="submit">
                      Adicionar serviço
                    </button>
                  </form>

                  <div
                    id="avisoCadastro"
                    class="alert d-none mt-3"
                    role="alert"
                  ></div>
                </div>
              </section>

              <div id="resultado" class="alert d-none mt-3" role="alert"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="js/orcamento.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
